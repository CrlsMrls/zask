# ZASK Example Rules
#
# Annotated example of Tier 2 static detection rules.
# Copy this file to /etc/zask/rules.yaml and customize for your environment.
#
# ─────────────────────────────────────────────────────────────────────────────
# Rule Schema
# ─────────────────────────────────────────────────────────────────────────────
#
# Each rule has 5 fields:
#
#   name:        Unique human-readable identifier (used in audit logs)
#   description: What the rule detects (for documentation)
#   pattern:     Go regex (re2) matched against the full argv string
#   action:      BLOCK — kill process + write verdict map entry
#                ALERT — log warning but allow execution
#   severity:    critical | high | medium | low (for prioritization)
#
# ─────────────────────────────────────────────────────────────────────────────
# Pattern Tips
# ─────────────────────────────────────────────────────────────────────────────
#
# - Patterns use Go's regexp (RE2 syntax, no lookahead/lookbehind)
# - The pattern is matched against the full argv string captured by the
#   eBPF LSM hook (bprm_check_security)
# - Use \s+ for whitespace matching (handles tabs and multiple spaces)
# - Test patterns with: go run -mod=mod golang.org/dl/gotip test -run TestRegex
# - Avoid overly broad patterns — false positives cause blocked legitimate tasks
#
# ─────────────────────────────────────────────────────────────────────────────
# Hot-Reload
# ─────────────────────────────────────────────────────────────────────────────
#
# Rules are automatically reloaded when this file is modified (via fsnotify).
# You can also send SIGHUP to the daemon to force a reload:
#
#   kill -HUP $(pidof zaskd)
#
# Invalid YAML or regex patterns in a reload are logged as errors and the
# previous valid ruleset is preserved.
#
# ─────────────────────────────────────────────────────────────────────────────

rules:
  # ── Reverse Shells (Critical) ──────────────────────────────────────────

  - name: reverse-shell-netcat
    description: "Detects netcat-based reverse shells (nc -e /bin/sh)"
    pattern: 'nc\s+.*-e\s+/bin/(sh|bash)'
    action: BLOCK
    severity: critical

  - name: reverse-shell-bash-tcp
    description: "Detects bash /dev/tcp reverse shells"
    pattern: '/dev/tcp/\d+\.\d+\.\d+\.\d+/\d+'
    action: BLOCK
    severity: critical

  - name: reverse-shell-python
    description: "Detects Python-based reverse shells using socket+pty"
    pattern: 'python[23]?\s+.*import\s+(socket|pty|subprocess).*connect'
    action: BLOCK
    severity: critical

  # ── Suspicious Execution (High) ────────────────────────────────────────

  - name: base64-decode-exec
    description: "Detects base64-decoded command execution piped to shell"
    pattern: 'base64\s+(-d|--decode)\s*\|.*sh'
    action: ALERT
    severity: high

  - name: curl-pipe-shell
    description: "Detects curl/wget piped directly to a shell interpreter"
    pattern: '(curl|wget)\s+.*\|\s*(ba)?sh'
    action: ALERT
    severity: high

  # ── Privilege Escalation (High) ────────────────────────────────────────

  # Example: detect attempts to chmod binaries to setuid
  # Uncomment if applicable to your environment:
  #
  # - name: setuid-chmod
  #   description: "Detects chmod +s (setuid bit) on executables"
  #   pattern: 'chmod\s+.*\+s\s+'
  #   action: ALERT
  #   severity: high

  # ── Container Escape (Critical) ────────────────────────────────────────

  # Example: detect nsenter usage which can escape container namespaces
  # Uncomment if running in containerized environments:
  #
  # - name: nsenter-escape
  #   description: "Detects nsenter targeting PID 1 namespace"
  #   pattern: 'nsenter\s+.*-t\s+1\s+'
  #   action: BLOCK
  #   severity: critical

  # ── Crypto Mining (Medium) ─────────────────────────────────────────────

  # Example: detect common crypto mining arguments
  # Uncomment to enable:
  #
  # - name: crypto-miner-stratum
  #   description: "Detects stratum protocol connections (crypto mining)"
  #   pattern: 'stratum\+tcp://'
  #   action: BLOCK
  #   severity: medium
