# golangci-lint configuration for ZASK
# https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - typecheck
    - gofmt
    - goimports
    - misspell
    - unconvert
    - goconst
    - errorlint
    - bodyclose
    - noctx

linters-settings:
  errcheck:
    check-type-assertions: true
  govet:
    enable-all: true
  errorlint:
    errorf: true
    asserts: true
    comparison: true
  goimports:
    local-prefixes: github.com/CrlsMrls/zask
  misspell:
    locale: US

issues:
  exclude-rules:
    # Allow fmt.Errorf without wrapping in test files
    - path: _test\.go
      linters:
        - errorlint
    # Don't check generated files
    - path: zask_bpf.*\.go
      linters:
        - errcheck
        - govet
        - staticcheck
