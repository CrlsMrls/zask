version: "2"
run:
  modules-download-mode: readonly
linters:
  enable:
    - bodyclose
    - errorlint
    - goconst
    - misspell
    - noctx
    - unconvert
  settings:
    errcheck:
      check-type-assertions: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    govet:
      enable-all: true
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errorlint
        path: _test\.go
      - linters:
          - errcheck
          - govet
          - staticcheck
        path: zask_bpf.*\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/CrlsMrls/zask
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
